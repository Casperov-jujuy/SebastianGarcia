<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTA 528 - Sebastián García para Concejal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>SEBASTIÁN GARCÍA PARA CONCEJAL</h1>
            <div class="score-container">
                <span>Baches tapados: </span>
                <span id="score">0</span>
            </div>
        </div>
        
        <div id="game-area">
            <div id="player"></div>
            <!-- Los baches se generarán dinámicamente aquí -->
            <div class="road"></div>
            <div class="message-box" id="message-box"></div>
        </div>
        
        <div class="campaign-banner">
            LISTA 528 - EL 11 DE MAYO GANA EL PUEBLO
        </div>
        
        <div class="instructions">
            <p>Utiliza las flechas para mover a Sebastián</p>
            <p>Presiona la barra espaciadora para tapar un bache</p>
        </div>
        
        <button id="play-music-button">INICIAR MÚSICA</button>
        
        <div class="credits-banner">
            FACUNDO MONTAÑO - QA & AI ENGINEER
        </div>
    </div>
    
    <div id="game-over" class="hidden">
        <h2>¡JUEGO TERMINADO!</h2>
        <p>Tapaste <span id="final-score">0</span> baches</p>
        <button id="restart-button">Jugar de nuevo</button>
    </div>
    
    <audio id="background-music" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>
    
    <script src="script.js"></script>
</body>
</html>
